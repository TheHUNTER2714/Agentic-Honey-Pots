<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agentic Honey-Pot</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>

<body class="bg-gradient-to-br from-slate-900 to-black text-white min-h-screen">

<canvas id="bg" style="position: fixed; top:0; left:0; width:100%; height:100%;"></canvas>

<div class="max-w-6xl mx-auto p-8 relative z-10">

<h1 class="text-4xl font-bold mb-2">🕵️ Agentic Honey-Pot</h1>
<p class="text-gray-400 mb-6">AI-powered scam detection & honeypot engagement</p>

<div class="grid md:grid-cols-2 gap-6">

<div class="bg-slate-800 p-6 rounded-2xl">
<h2 class="text-xl font-semibold mb-4">Incoming Message</h2>

<textarea id="message"
class="w-full p-3 rounded bg-slate-900 border border-slate-700"
rows="4"
placeholder="Paste scam message here..."></textarea>

<button onclick="sendMessage()"
class="mt-4 w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl">

Analyze & Engage

</button>

</div>

<div class="bg-slate-800 p-6 rounded-2xl">

<h2 class="text-xl font-semibold mb-4">System Response</h2>

<pre id="response"
class="text-sm text-green-400 whitespace-pre-wrap"></pre>

</div>

</div>

</div>

<script>

/* ---------- ThreeJS Background ---------- */

const bg = document.getElementById('bg');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
canvas: bg,
alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);

const geometry = new THREE.BufferGeometry();

const count = 1200;

const positions = new Float32Array(count * 3);

for (let i = 0; i < count * 3; i++) {
positions[i] = (Math.random() - 0.5) * 10;
}

geometry.setAttribute(
"position",
new THREE.BufferAttribute(positions, 3)
);

const material = new THREE.PointsMaterial({
color: 0x38bdf8,
size: 0.02
});

const points = new THREE.Points(geometry, material);

scene.add(points);

camera.position.z = 5;

function animate() {

requestAnimationFrame(animate);

points.rotation.y += 0.0006;

renderer.render(scene, camera);

}

animate();

/* ---------- API CALL ---------- */

async function sendMessage(){

const msg = document.getElementById("message").value;

const resBox = document.getElementById("response");

if(!msg){
resBox.textContent = "Please enter a message.";
return;
}

resBox.textContent = "Analyzing scam message...";

try{

const res = await fetch(
"https://agentic-honey-pots.onrender.com/honeypot/message",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"x-api-key":"hunter-secret"
},

body: JSON.stringify({

sessionId:"demo-session",

message:{
sender:"scammer",
text: msg,
timestamp: Date.now()
},

conversationHistory:[],

metadata:{
channel:"SMS",
language:"English",
locale:"IN"
}

})

});

const data = await res.json();

resBox.textContent = JSON.stringify(data,null,2);

}
catch(err){

resBox.textContent =
"Error contacting API. Server may be sleeping.";

}

}

</script>

</body>
</html>
