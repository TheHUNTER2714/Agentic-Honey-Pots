<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Agentic Honey-Pot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-black text-white min-h-screen">

<canvas id="bg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%;"></canvas>

<div class="max-w-6xl mx-auto p-8 relative z-10">
    <h1 class="text-4xl font-bold mb-2">🕵️ Agentic Honey-Pot</h1>
    <p class="text-gray-400 mb-6">AI-powered scam detection & intelligence extraction</p>

    <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-slate-800 p-6 rounded-2xl">
            <h2 class="text-xl font-semibold mb-4">Incoming Message</h2>
            <textarea id="message" class="w-full p-3 rounded bg-slate-900 border border-slate-700" rows="4"
                placeholder="Paste scam message here..."></textarea>
            <button onclick="sendMessage()" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl">
                Analyze & Engage
            </button>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl">
            <h2 class="text-xl font-semibold mb-4">System Response</h2>
            <pre id="response" class="text-sm text-green-400 whitespace-pre-wrap"></pre>
        </div>
    </div>

    <div class="grid md:grid-cols-2 gap-6 mt-6">
        <div class="bg-slate-800 p-6 rounded-2xl">
            <h2 class="text-xl font-semibold mb-4">UPI IDs</h2>
            <ul id="upiList" class="text-sm text-yellow-400"></ul>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl">
            <h2 class="text-xl font-semibold mb-4">Phishing Links</h2>
            <ul id="linkList" class="text-sm text-red-400"></ul>
        </div>
    </div>
</div>

<script>
const bg = document.getElementById('bg');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: bg, alpha: true });
renderer.setSize(innerWidth, innerHeight);

const geo = new THREE.BufferGeometry();
const count = 1200;
const pos = new Float32Array(count * 3);
for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 10;
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));

const mat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.02 });
const pts = new THREE.Points(geo, mat);
scene.add(pts);
camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    pts.rotation.y += 0.0006;
    renderer.render(scene, camera);
}
animate();

async function sendMessage() {
    const msg = document.getElementById("message").value;
    const resBox = document.getElementById("response");
    resBox.textContent = "Processing...";

    const res = await fetch("https://agentic-honey-pots.onrender.com/honeypot/message", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-KEY": "hunter-secret" },
        body: JSON.stringify({ conversation_id: "demo-123", message: msg })
    });

    const data = await res.json();
    resBox.textContent = JSON.stringify(data, null, 2);

    const upiList = document.getElementById("upiList");
    const linkList = document.getElementById("linkList");

    upiList.innerHTML = "";
    linkList.innerHTML = "";

    data.extracted_intelligence.upi_ids.forEach(u => {
        const li = document.createElement("li");
        li.textContent = u;
        upiList.appendChild(li);
    });

    data.extracted_intelligence.phishing_links.forEach(l => {
        const li = document.createElement("li");
        li.textContent = l;
        linkList.appendChild(li);
    });
}
</script>
</body>
</html>
